<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BANTRACKER.ORG // LIVE</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#e0e0e0;font-family:system-ui;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:20px}.header{display:flex;justify-content:space-between;align-items:center;border:1px solid #222;border-radius:14px;padding:14px 18px;background:#111;margin-bottom:16px}
.live{animation:pulse 2s infinite;background:#00ff88;color:#000;padding:4px 12px;border-radius:20px;font-weight:900;font-size:12px}
@keyframes pulse{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{border:1px solid #222;background:#111;border-radius:12px;padding:14px;text-align:center}.stat b{font-size:22px;color:#fff;display:block}.stat span{font-size:10px;color:#888;letter-spacing:.1em}
.card{background:#151515;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:10px}.badge{background:#ff3b3b;color:#fff;font-size:10px;padding:2px 8px;border-radius:12px;font-weight:700}a{color:#00ff88;text-decoration:none}</style>
</head><body><div class="wrap">
<div class="header"><div style="font-weight:900">🚫 BANTRACKER.ORG // TELEGRAM BAN MONITOR</div><div class="live">● LIVE</div></div>
<div class="stats"><div class="stat"><b>13</b><span>COUNTRIES BLOCKING</span></div><div class="stat"><b id="todayCount">...</b><span>BANNED TODAY</span></div><div class="stat"><b>40+</b><span>DISRUPTIONS</span></div></div>
<div style="border:1px solid #222;border-radius:14px;padding:16px;background:#0f0f0f;margin-bottom:16px">
<div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:11px;font-weight:700"><span>🔴 LIVE BAN FEED</span><span style="color:#555" id="updated">Loading...</span></div>
<div id="ban-list"><div style="text-align:center;padding:30px;color:#666">⏳ Loading...</div></div></div>
<div style="text-align:center;margin-top:20px;font-size:10px;color:#444">OPEN SOURCE • API: /api/bans.json • HOSTED ON GITHUB</div></div>
<script>
fetch("https://gist.githubusercontent.com/cylon2001/010acebae936cfeae5cb4f93a01a20d8/raw/gistfile1.txt?v="+Date.now()).then(r=>r.json()).then(data=>{
 let items=data.items||data;let h='';items.forEach((i,idx)=>{let d="NEWS";try{d=new URL(i.url).hostname.replace("www.","").toUpperCase();}catch{}
 h+=`<div class="card"><div style="display:flex;justify-content:space-between"><span class="badge">${d}</span><span style="font-size:10px;color:#555">${idx===0?'JUST NOW':''}</span></div><div style="font-weight:700;font-size:13px;color:#fff">${idx+1}️⃣ ${i.title}</div><div style="font-size:11px;color:#888;margin:6px 0">${(i.summary||'').slice(0,160)}</div><a href="${i.url}" target="_blank" style="font-size:11px">→ Read source ↗</a></div>`;});
 document.getElementById('ban-list').innerHTML=h;document.getElementById('todayCount').innerText=items.length;document.getElementById('updated').innerText=(data.updated||'')+' • Auto 6h';
}).catch(e=>{document.getElementById('ban-list').innerHTML='<div style="color:#ff6b6b">🔴 India blocks Telegram<br>🔴 Russia $1.26B fine<br>🔴 Kazakhstan blocking anon</div>';});
</script></body></html>
