<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BANTRACKER.ORG - Global Telegram Ban Monitor LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:system-ui,Segoe UI,Roboto;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;border:1px solid #222;border-radius:14px;padding:12px 16px;background:#111;margin-bottom:14px}
.live{background:#00ff88;color:#000;padding:4px 10px;border-radius:20px;font-weight:900;font-size:11px;animation:pulse 2s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.box{border:1px solid #222;background:#111;border-radius:12px;padding:12px;text-align:center}
.box b{font-size:22px;display:block;color:#fff}.box span{font-size:10px;color:#888;letter-spacing:.12em}
.feed{border:1px solid #222;border-radius:14px;background:#0f0f0f;padding:14px}
.card{background:#151515;border:1px solid #222;border-radius:12px;padding:12px;margin-bottom:10px}
.badge{background:#ff3b3b;color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:800}
a{color:#00ff88;text-decoration:none}a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div style="font-weight:900;letter-spacing:.08em">🚫 BANTRACKER.ORG // TELEGRAM BAN MONITOR</div><div class="live">● LIVE</div></div>
<div class="grid3"><div class="box"><b>13</b><span>COUNTRIES BLOCKING</span></div><div class="box"><b id="cnt">...</b><span>BANNED TODAY</span></div><div class="box"><b>40+</b><span>DISRUPTIONS</span></div></div>
<div class="feed"><div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:11px;font-weight:700;letter-spacing:.1em"><span>🔴 LIVE BAN FEED — AUTO EVERY 6H</span><span id="upd" style="color:#555">Loading...</span></div><div id="list"><div style="padding:30px;text-align:center;color:#666">⏳ Loading live from gist...</div></div></div>
<div style="text-align:center;margin-top:14px;font-size:10px;color:#444">OPEN SOURCE • API: gist • HOSTED ON GITHUB • NO TRACKING</div>
</div>
<script>
const GIST="https://gist.githubusercontent.com/cylon2001/010acebae936cfeae5cb4f93a01a20d8/raw/gistfile1.txt?v="+Date.now();
fetch(GIST).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(j=>{
 const items=j.items||j; const upd=j.updated||"";
 document.getElementById('cnt').innerText=items.length;
 document.getElementById('upd').innerText=(upd?upd+" • ":"")+ "Auto 6h • "+new Date().toLocaleTimeString();
 let h="";
 items.forEach((it,i)=>{
  let dom="NEWS.GOOGLE.COM"; try{dom=new URL(it.url).hostname.replace("www.","").toUpperCase().slice(0,22);}catch{}
  let badge = dom.includes("GOOGLE")?"NEWS.GOOGLE.COM":dom;
  let time = i==0?"JUST NOW":i==1?"1h ago":i+"h ago";
  h+=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span class="badge">${badge}</span><span style="font-size:10px;color:#555">${time}</span></div><div style="font-weight:700;font-size:13px;color:#fff;margin-bottom:4px">${i+1}️⃣ ${it.title}</div><div style="font-size:11px;color:#888;margin-bottom:6px">${(it.summary||"").slice(0,180)}</div><a href="${it.url}" target="_blank" style="font-size:11px">→ Read source ↗</a></div>`;
 });
 document.getElementById('list').innerHTML=h||"<div style='color:#888'>No items yet</div>";
}).catch(e=>{
 document.getElementById('list').innerHTML="<div style='color:#ff6b6b;padding:10px'>Error loading gist: "+e.message+"<br><br>Check gist URL is public and raw.<br>Fallback: India temporarily blocks Telegram, Russia fine, etc.</div>";
});
</script>
</body>
</html>
