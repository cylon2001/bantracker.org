<script>
const GIST="https://divine-moon-91ef.cylon2001.workers.dev?v="+Date.now();
let ALL=[];
function render(arr){
 const list=document.getElementById('list'); let h="";
 arr.forEach((it,i)=>{
  let dom="NEWS"; try{dom=new URL(it.url).hostname.replace("www.","").toUpperCase().slice(0,22);}catch{}
  h+=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span class="badge">${dom}</span><span style="font-size:10px;color:#555">${i==0?"JUST NOW":i+"h ago"}</span></div><div style="font-weight:700;font-size:13px;color:#fff;margin-bottom:4px">${it.title}</div><div style="font-size:11px;color:#888;margin-bottom:6px">${(it.summary||"").slice(0,180)}</div><a href="${it.url}" target="_blank" style="font-size:11px">→ Read source ↗</a></div>`;
 });
 list.innerHTML=h||"<div style='color:#888'>No results</div>";
}
fetch(GIST).then(r=>r.json()).then(j=>{
 const items=j.items||j; ALL=items;
 document.getElementById('cnt').innerText=items.length;
 document.getElementById('upd').innerText=(j.updated||"")+" • "+new Date().toLocaleTimeString();
 render(ALL);
}).catch(e=>{document.getElementById('list').innerHTML="Error: "+e});
// search
document.getElementById('q').addEventListener('input',e=>{
 const q=e.target.value.toLowerCase(); render(ALL.filter(x=> (x.title+" "+x.summary).toLowerCase().includes(q) ));
});
document.querySelectorAll('.fbtn').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('active')); b.classList.add('active');
 const f=b.dataset.f; if(f==='all') render(ALL); else render(ALL.filter(x=> (x.title+" "+x.summary).toLowerCase().includes(f.toLowerCase())));
}));
// map
const map=L.map('map',{zoomControl:false}).setView([20,0],1.8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:5}).addTo(map);
const banned=[{name:"India",c:[21,78]},{name:"Russia",c:[61,105]},{name:"Iran",c:[32,53]},{name:"China",c:[35,104]},{name:"Brazil",c:[-14,-51]},{name:"Pakistan",c:[30,69]},{name:"Indonesia",c:[-0.7,113]},{name:"Spain",c:[40,-3]},{name:"Thailand",c:[15,100]},{name:"Iraq",c:[33,44]},{name:"Cuba",c:[21,-79]},{name:"Azerbaijan",c:[40,47]},{name:"Bahrain",c:[26,50]}];
banned.forEach(b=>{
 L.circleMarker(b.c,{radius:8,color:"#ff3b3b",fillColor:"#ff3b3b",fillOpacity:.8,weight:2}).addTo(map).bindPopup("<b>"+b.name+"</b><br>Telegram blocked / restricted");
});
</script>
