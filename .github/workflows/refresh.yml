name: Refresh Ban Tracker Data
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run refresh script
        run: python scripts/refresh_bans.py
      - name: Commit and push if changed
        run: |
          git config user.name "bantracker-bot"
          git config user.email "bot@bantracker.org"
          git add ban-tracker.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-refresh ban data $(date -u +%Y-%m-%d\ %H:%M)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) - pulling latest and retrying..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Real conflict on the data file - giving up this run cleanly, next scheduled run will catch up."
              git rebase --abort
              exit 0
            fi
          done
          echo "Still could not push after 5 attempts."
          exit 1
