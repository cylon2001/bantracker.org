name: Refresh Ban Tracker Data

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run refresh script
        run: python scripts/refresh_bans.py

      - name: Commit and push if changed
        run: |
          git config user.name "bantracker-bot"
          git config user.email "bot@bantracker.org"
          git add ban-tracker.json
          git diff --staged --quiet || git commit -m "Auto-refresh ban data $(date -u +%Y-%m-%d\ %H:%M)"
          git push
